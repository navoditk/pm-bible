name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv and install project
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: .venv/bin/ruff check src tests scripts

      - name: Repo structure check
        run: .venv/bin/python scripts/check_repo.py

      - name: Test (pytest)
        run: .venv/bin/pytest
